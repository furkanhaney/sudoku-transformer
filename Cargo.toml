[package]
name = "sudoku-transformer"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "A generated-data Sudoku transformer in Rust on Axis"
repository = "https://github.com/furkanhaney/sudoku-transformer"
default-run = "sudoku-transformer"

[dependencies]
axis = { git = "https://github.com/furkanhaney/axis.git", rev = "8a2c46672192dbbbc1d4f747652ad1ebea1daa90" }

[[bin]]
name = "sudoku-transformer"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
