[package]
name = "sudoku-transformer"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
description = "A generated-data Sudoku transformer in Rust on Axis"
repository = "https://github.com/furkanhaney/sudoku-transformer"
default-run = "sudoku-transformer"

[dependencies]
axis = { git = "https://github.com/furkanhaney/axis.git", rev = "5d45f00e8141b3deda86fedda71e2ba2c7cf0c76" }

[[bin]]
name = "sudoku-transformer"
path = "src/main.rs"

[lints.rust]
unsafe_code = "deny"
